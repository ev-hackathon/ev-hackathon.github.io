name: 충전량 API 확인
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m scripts.probe_energy
        env:
          EV_API_KEY: ${{ secrets.EV_API_KEY }}
