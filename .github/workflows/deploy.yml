# 실제 데이터 사이트: 15분마다 공공 API로 충북 충전기 상태를 받아 기록하고, GitHub Pages에 사이트와 함께 올립니다.
# 서버를 따로 켜 둘 필요가 없습니다.
#
# 처음 한 번만 설정 (저장소 Settings):
#   1. Secrets and variables > Actions > New repository secret
#      이름 EV_API_KEY, 값은 공공데이터포털 인증키(Decoding 키 권장)
#   2. Pages > Build and deployment > Source를 "GitHub Actions"로
#   3. Actions 탭 > "실제 데이터 사이트" > Run workflow 로 한 번 실행
# 주소: https://<계정>.github.io/<저장소>/
#
# 기록은 main이 아닌 history 브랜치에 쌓아 코드 이력을 어지럽히지 않습니다.
# GitHub 예약 실행은 붐비는 시간에 몇 분~수십 분 늦게 돌 수 있습니다.
name: 실제 데이터 사이트

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "docs/index.html", "utils/**", "scripts/**", "config.py", "data/chungbuk_sigungu.geojson", ".github/workflows/deploy.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      collect_error: ${{ steps.result.outputs.collect_error }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: 패키지 설치
        run: pip install pandas numpy requests python-dotenv

      - name: history 브랜치 준비
        run: |
          if git ls-remote --exit-code --heads origin history >/dev/null; then
            git fetch --depth 1 origin history:history
            git worktree add hist history
          else
            git worktree add --detach hist
            git -C hist switch --orphan history
          fi
          mkdir -p hist/history

      - name: 수집하고 사이트 만들기
        env:
          EV_API_KEY: ${{ secrets.EV_API_KEY }}
          # 수동 실행·코드 변경 때도 수집. 예약 실행이 아니어도 데이터가 바로 보이도록
        run: python -m scripts.publish_static --history hist/history --out _site

      - name: 기록 커밋
        run: |
          cd hist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then echo "새 기록 없음"; exit 0; fi
          git commit -q -m "기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push origin history

      - id: result
        name: 수집 결과
        run: |
          err=$(python -c "import json;print(json.load(open('_site/data/status.json'))['collect_error'] or '')")
          echo "collect_error=$err" >> "$GITHUB_OUTPUT"
          python -c "import json;s=json.load(open('_site/data/status.json'));print('마지막 기록:', {k:v['t'] for k,v in s['regions'].items()})"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 사이트는 이전 기록으로 배포하되, 수집이 실패했으면 Actions에 빨간 표시로 알림
      - name: 수집 실패 알림
        if: needs.build.outputs.collect_error != ''
        run: |
          echo "::error::수집 실패: ${{ needs.build.outputs.collect_error }}"
          exit 1
