# 실제 데이터 사이트: 기록으로 사이트와 AI 예측(data/forecast.json)을 만들어 GitHub Pages에 올립니다.
# 수집은 collect.yml(15분 간격 수집기)이 맡고, 수집할 때마다 이 워크플로를 불러 사이트를 갱신합니다.
# 수집기가 멈춰 기록이 40분 넘게 비면 이 워크플로가 대신 수집합니다.
#
# 처음 한 번만 설정 (저장소 Settings):
#   1. Secrets and variables > Actions > New repository secret
#      이름 EV_API_KEY, 값은 공공데이터포털 인증키(Decoding 키 권장)
#   2. Pages > Build and deployment > Source를 "GitHub Actions"로
#   3. Actions 탭 > "실제 데이터 사이트" > Run workflow 로 한 번 실행
# 주소: https://<계정>.github.io/<저장소>/
#
# 기록은 main이 아닌 history 브랜치에 쌓아 코드 이력을 어지럽히지 않습니다.
# GitHub 예약 실행은 붐비는 시간에 몇 분~수십 분 늦게 돌 수 있습니다.
name: 실제 데이터 사이트

on:
  schedule:
    - cron: "*/30 * * * *"   # 예비: 수집기가 멈췄을 때만 수집
  workflow_dispatch:
    inputs:
      collect:
        description: "수집 여부 (auto: 기록이 40분 넘게 비었을 때만)"
        default: "auto"
        type: choice
        options: ["auto", "true", "false"]
  push:
    branches: [main]
    paths: ["web/**", "docs/index.html", "utils/**", "scripts/**", "config.py", "data/chungbuk_sigungu.geojson", ".github/workflows/deploy.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: read   # 멈춘 Pages 배포 찾기 (아래 deploy 작업)

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      collect_error: ${{ steps.result.outputs.collect_error }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: 패키지 설치
        run: pip install pandas numpy requests python-dotenv lightgbm scikit-learn

      - name: history 브랜치 준비
        run: |
          if git ls-remote --exit-code --heads origin history >/dev/null; then
            git fetch --depth 1 origin history:history
            git worktree add hist history
          else
            git worktree add --detach hist
            git -C hist switch --orphan history
          fi
          mkdir -p hist/history

      - name: 수집 여부 결정
        id: mode
        run: |
          want="${{ github.event.inputs.collect || 'auto' }}"
          if [ "$want" = "auto" ]; then
            last=$(git -C hist log -1 --format=%ct 2>/dev/null || echo 0)
            age=$(( $(date +%s) - last ))
            if [ "$age" -gt 2400 ]; then want=true; else want=false; fi
            echo "마지막 기록 $((age / 60))분 전 → 수집 $want"
          fi
          echo "collect=$want" >> "$GITHUB_OUTPUT"

      - name: 수집하고 사이트 만들기
        env:
          EV_API_KEY: ${{ secrets.EV_API_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.collect }}" = "true" ]; then
            python -m scripts.publish_static --history hist/history --out _site
          else
            python -m scripts.publish_static --history hist/history --out _site --no-collect
          fi

      # AI 예측: 1시간 후 충전소별 이용률 (실패해도 사이트 배포는 계속)
      - name: AI 수요 예측
        continue-on-error: true
        env:
          EV_API_KEY: ${{ secrets.EV_API_KEY }}   # 날씨(기상청) 자료도 같은 공공데이터포털 키
        run: python -m scripts.forecast --history hist/history --out _site/data/forecast.json --eval-every-hours 100000   # 성능 평가는 수집기가 하루 한 번

      - name: 기록 커밋
        run: |
          cd hist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then echo "새 기록 없음"; exit 0; fi
          git commit -q -m "기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git push origin history && exit 0
            git fetch --depth 5 origin history
            git rebase origin/history || { git rebase --abort; echo "::warning::수집기와 동시에 기록해 이번 기록은 건너뜀"; exit 0; }
          done

      - id: result
        name: 수집 결과
        run: |
          err=$(python -c "import json;print(json.load(open('_site/data/status.json'))['collect_error'] or '')")
          echo "collect_error=$err" >> "$GITHUB_OUTPUT"
          python -c "import json;s=json.load(open('_site/data/status.json'));print('마지막 기록:', {k:v['t'] for k,v in s['regions'].items()})"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4   # scripts/pages_unstick.sh
        with:
          sparse-checkout: scripts

      # 한 번에 5분까지 기다림 (기본 10분). GitHub 쪽에서 멈추면 빨리 포기하고 아래에서 정리 후 다시 시도
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000

      # GitHub 쪽에서 이전 배포가 '진행 중'으로 멈추면 새 배포가 모두 거절됨 ("Please cancel <sha> first").
      # 2026-11-05 새벽 30분 넘게 사이트가 멈춰 추가. 배포가 실패했을 때만 끝나지 않은 Pages 배포를 취소하고 다시 시도.
      - name: 멈춘 배포 정리
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pages_unstick.sh

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000

      - name: 한 번 더 정리 후 마지막 시도
        if: steps.retry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          bash scripts/pages_unstick.sh

      - id: retry2
        if: steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

      # 사이트는 이전 기록으로 배포하되, 수집이 실패했으면 Actions에 빨간 표시로 알림
      - name: 수집 실패 알림
        if: needs.build.outputs.collect_error != ''
        run: |
          echo "::error::수집 실패: ${{ needs.build.outputs.collect_error }}"
          exit 1
